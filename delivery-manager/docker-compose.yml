version: "3.8"

services:
  delivery-manager-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-manager-service
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/delivery_manager_db
      - SPRING_DATASOURCE_USERNAME=pathfinder
      - SPRING_DATASOURCE_PASSWORD=pathfinder123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - pathfinder-network
    depends_on:
      - postgres
      - redis
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  pathfinder-network:
    external: true
