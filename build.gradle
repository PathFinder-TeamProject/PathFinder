plugins {
	id 'java'
}

allprojects {
	group = 'com.pathfinder'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()

		maven { url 'https://jitpack.io' }
	}
}

subprojects {
	apply plugin: 'java'

	sourceCompatibility = '17'
	targetCompatibility = '17'

	dependencies {
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
	}
}
