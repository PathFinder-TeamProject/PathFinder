version: '3.8'

services:
  hub-service:
    container_name: hub-service
    build:
      context: C:/Users/qwew1/Desktop/Java2025/PathFinder/com.hub-service
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hub
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    networks:
      - msa-network
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: hub-postgres
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - msa-network

  redis:
    image: redis:7
    container_name: hub-redis
    ports:
      - "6380:6379"
    networks:
      - msa-network

networks:
  msa-network:
    driver: bridge

volumes:
  postgres_data:
