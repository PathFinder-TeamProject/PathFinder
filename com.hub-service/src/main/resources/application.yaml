spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/hub
    username: postgres
    password: 1234

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379
      password: systempass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect