server:
  port: 8082

spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:postgresql://localhost:5432/delivery_db
    username: pathfinder
    password: pathfinder123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: delivery-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

# Eureka 비활성화 (단독 테스트용)
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
          - feign.FeignException
    instances:
      order-service:
        baseConfig: default
        waitDurationInOpenState: 15s
      hub-service:
        baseConfig: default
        waitDurationInOpenState: 15s
      delivery-manager-service:
        baseConfig: default
        waitDurationInOpenState: 15s
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
    instances:
      order-service:
        baseConfig: default
      hub-service:
        baseConfig: default
      delivery-manager-service:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
    instances:
      order-service:
        baseConfig: default
      hub-service:
        baseConfig: default
      delivery-manager-service:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.pathfinder.delivery: INFO
    com.pathfinder.delivery.infrastructure.external.security: INFO
    org.springframework.cloud: DEBUG
    org.springframework.kafka: INFO
    org.springframework.cloud.openfeign: DEBUG
    org.springframework.security: INFO

delivery:
  outbox:
    publisher:
      poll-interval: 5000
      batch-size: 50
      max-retries: 5

# JWT 설정 (테스트용)
security:
  jwt:
    access-header-name: Authorization
    header-prefix: "Bearer "
    access-subject: access
