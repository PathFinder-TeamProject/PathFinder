server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/delivery_db
    username: pathfinder
    password: pathfinder123
  jpa:
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      database: 1
  kafka:
    consumer:
      group-id: delivery-service-group

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
          - feign.FeignException
    instances:
      order-service:
        baseConfig: default
        waitDurationInOpenState: 15s
      hub-service:
        baseConfig: default
        waitDurationInOpenState: 15s
      delivery-manager-service:
        baseConfig: default
        waitDurationInOpenState: 15s
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
    instances:
      order-service:
        baseConfig: default
      hub-service:
        baseConfig: default
      delivery-manager-service:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
    instances:
      order-service:
        baseConfig: default
      hub-service:
        baseConfig: default
      delivery-manager-service:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.pathfinder.delivery: DEBUG
    org.springframework.cloud: DEBUG
    org.springframework.kafka: INFO
    org.springframework.cloud.openfeign: DEBUG

delivery:
  outbox:
    publisher:
      poll-interval: 5000
      batch-size: 50
      max-retries: 5
jwt:
  secret:
    key: c3BhcnRhX3Rpa2l0YWthX2JhcHppcF8xMjM0NTY3ODk=
