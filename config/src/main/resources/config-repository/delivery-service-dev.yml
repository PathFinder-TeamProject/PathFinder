server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/delivery_db
  data:
    redis:
      database: 1
  kafka:
    consumer:
      group-id: delivery-service-group

# Resilience4j 서비스별 설정 (기본값 override)
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        eventConsumerBufferSize: 10
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
          - feign.FeignException
    instances:
      order-service:
        baseConfig: default
        waitDurationInOpenState: 15s
      hub-service:
        baseConfig: default
        waitDurationInOpenState: 15s
      delivery-manager-service:
        baseConfig: default
        waitDurationInOpenState: 15s
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
          - feign.FeignException
    instances:
      order-service:
        baseConfig: default
      hub-service:
        baseConfig: default
      delivery-manager-service:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
    instances:
      order-service:
        baseConfig: default
      hub-service:
        baseConfig: default
      delivery-manager-service:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.pathfinder.delivery: DEBUG

delivery:
  outbox:
    publisher:
      poll-interval: 5000
      batch-size: 50
      max-retries: 5
