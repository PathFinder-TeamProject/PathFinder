server:
  port: 8088

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/message_db
    username: pathfinder
    password: pathfinder123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000
      connect-timeout: 6000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.pathfinder.message: DEBUG
    org.springframework.web: DEBUG
