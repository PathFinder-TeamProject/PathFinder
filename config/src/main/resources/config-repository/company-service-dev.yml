server:
  port: 8087

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/company_db
    username: pathfinder
    password: pathfinder123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000
      connect-timeout: 6000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    exporter:
      zipkin:
        endpoint: "http://localhost:9411/api/v2/spans"

logging:
  level:
    com.pathfinder.company: DEBUG
    org.springframework.web: DEBUG
