server:
  port: 8083

spring:
  application:
    name: order-service
  cloud:
    config:
      enabled: false
#      uri: http://localhost:8888   # ← Config Server의 주소
#      name: order-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/order
    username: postgres
    password: 1234

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379
      password: systempass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
